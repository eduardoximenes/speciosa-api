services:
  app:
    build:
      context: .
    container_name: speciosa-api-app
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: speciosa_api
      DB_USERNAME: speciosa
      DB_PASSWORD: speciosa
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: speciosa-api-db
    # ports:
    #   - "33060:3306"
    environment:
      MYSQL_DATABASE: speciosa_api
      MYSQL_USER: speciosa
      MYSQL_PASSWORD: speciosa
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
